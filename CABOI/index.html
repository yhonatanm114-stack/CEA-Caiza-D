<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEA Caiza "D" &middot; Gestión de Laboratorio de Computacion</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="login">
<form class="box" onsubmit="return L(event)">
<div style="margin-bottom:15px; display:flex; justify-content:center;">
  <div style="width:120px; height:120px; border-radius:50%; overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,0.6); border:3px solid rgba(255,255,255,0.4); background:#fff; display:flex; align-items:center; justify-content:center;">
    <img src="" alt="Logo CEA Caiza D" style="width:100%; height:100%; object-fit:contain; padding:4px;">
  </div>
</div>
<h1>CEA Caiza "D"</h1>
<small>Gestión de incidencias, diagnósticos y mantenimiento del laboratorio</small>
<input id="u" placeholder="Usuario" required>
<input id="p" type="password" placeholder="Contraseña" required>
<button>Ingresar</button>
<div id="err"></div>
</form>
</div>
<div id="app">
<aside>
<h2>&#128187; Lab. CEA Caiza D</h2>
<button class="nav on" data-v="dash">&#128202; Dashboard</button>
<button class="nav" data-v="eq">&#128187; Equipos</button>
<button class="nav" data-v="inc">&#128680; Incidencias</button>
<button class="nav" data-v="man">&#128295; Mantenimiento</button>
<div style="flex:1"></div>
<small id="who" style="color:var(--m)"></small>
<button class="g" onclick="reporte()">&#128196; Reporte PDF</button>
<button class="g" onclick="api('logout','POST').then(()=>location.reload())">Cerrar sesión</button>
</aside>
<main id="main"></main>
</div>
<div id="mod" onclick="if(event.target==this)X()">
<div class="card" id="mc"></div>
</div>
<script src="js/jspdf.umd.min.js"></script>
<script src="js/jspdf.plugin.autotable.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
